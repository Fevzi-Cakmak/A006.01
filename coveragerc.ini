[run]
source = research
omit = 
    */tests/*
    */__init__.py
    */reporting/reporter.py  # Excel bağımlı olduğu için şimdilik hariç
    */plotting/*            # Görselleştirme testleri ayrıca ele alınabilir

[report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.: